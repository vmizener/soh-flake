name: "Poll & Update Shipwright Release"

on:
  schedule:
    # Run every 12 hours (00:15, 12:15 UTC)
    - cron: "15 */12 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-upstream:
    name: "Check for New Release"
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      name: ${{ steps.check.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query upstream GitHub release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-release.sh --check-only

  update-and-pr:
    name: "Update & Create Pull Request"
    needs: check-upstream
    if: needs.check-upstream.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Update release and compute hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-release.sh

      - name: Run fast checks
        run: nix flake check --show-trace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "chore(release): update to ${{ needs.check-upstream.outputs.version }}"
          title: "Update to ${{ needs.check-upstream.outputs.version }}"
          body: |
            Automated update to upstream release.
            - **Release name**: `${{ needs.check-upstream.outputs.name }}`
            - **Version**: `${{ needs.check-upstream.outputs.version }}`
          branch: "auto-update/soh-${{ needs.check-upstream.outputs.version }}"
          delete-branch: true
